name: Build and Deploy TinyRPG

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TinyRPG
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TinyRPG
        run: npm run build

      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          repository: heheas/heheas.github.io
          token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          path: website

      - name: Replace TinyRPG build
        run: |
          rm -rf website/TinyRPG
          mkdir -p website/TinyRPG
          cp -R dist/. website/TinyRPG/

      - name: Commit and push TinyRPG
        working-directory: website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add TinyRPG

          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy TinyRPG"
            git push
          fi
